services:
  - type: web
    name: nebuback
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn devconf.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://nebulab.digital
      - key: RESET_PASSWORD_FROM
        value: Nebulab <noreply@nebulab.digital>
      - key: RESEND_API_KEY
        sync: false
